<script>
(()=>{
const MOD=window.CC_MODELS||{},K=window.CCK;
function use(name,fb,...a){try{if(MOD[name]&&K)return MOD[name](...a);}catch(e){console.warn('model '+name+' failed, using fallback',e);}return fb?fb(...a):null;}
const ren=new THREE.WebGLRenderer({antialias:true,powerPreference:'high-performance'});ren.setPixelRatio(Math.min(devicePixelRatio,1.5));ren.shadowMap.enabled=true;ren.shadowMap.type=THREE.PCFSoftShadowMap;
ren.toneMapping=THREE.ACESFilmicToneMapping;ren.toneMappingExposure=1.3;ren.outputEncoding=THREE.sRGBEncoding;document.body.prepend(ren.domElement);
const HORIZON=new THREE.Color(0xf0cfae),ZENITH=new THREE.Color(0x3f6fae);

const cam=new THREE.PerspectiveCamera(72,1,.03,4000);scene.add(cam);

const sun=new THREE.DirectionalLight(0xffc48a,2.1);sun.castShadow=true;sun.shadow.mapSize.set(2048,2048);sun.shadow.bias=-.0004;sun.shadow.normalBias=.03;

function resize(){ren.setSize(innerWidth,innerHeight);cam.aspect=innerWidth/innerHeight;cam.updateProjectionMatrix();}addEventListener('resize',resize);resize();
const mat=c=>new THREE.MeshStandardMaterial({color:c,roughness:.85});
const rnd=(a,b)=>a+Math.random()*(b-a);

// ---------- sky dome ----------
const sky=new THREE.Mesh(new THREE.SphereGeometry(1800,48,24),new THREE.ShaderMaterial({side:THREE.BackSide,depthWrite:false,fog:false,
 uniforms:{uH:{value:HORIZON},uZ:{value:ZENITH},uSun:{value:SUNDIR},uT:{value:0}},
 vertexShader:`varying vec3 vD;void main(){vD=normalize(position);gl_Position=projectionMatrix*modelViewMatrix*vec4(position,1.);}`,
 fragmentShader:`uniform vec3 uH,uZ,uSun;uniform float uT;varying vec3 vD;
 float h(vec2 p){return fract(sin(dot(p,vec2(127.1,311.7)))*43758.5453);}
 float n(vec2 p){vec2 i=floor(p),f=fract(p);f=f*f*(3.-2.*f);return mix(mix(h(i),h(i+vec2(1,0)),f.x),mix(h(i+vec2(0,1)),h(i+vec2(1,1)),f.x),f.y);}
 float fbm(vec2 p){float s=0.,a=.5;for(int i=0;i<5;i++){s+=n(p)*a;p*=2.03;a*=.5;}return s;}
 void main(){vec3 d=normalize(vD);float y=max(d.y,0.);vec3 col=mix(uH,uZ,pow(y,.55));
  float sd=max(dot(d,normalize(uSun)),0.);col+=vec3(1.,.72,.42)*pow(sd,8.)*.35+vec3(1.,.85,.6)*pow(sd,64.)*.6;col=mix(col,vec3(1.,.97,.88),smoothstep(.9994,.9997,sd));
  if(d.y>0.){vec2 uv=d.xz/(d.y+.12)*1.6+vec2(uT*.006,uT*.002);float c=smoothstep(.48,.78,fbm(uv));float fade=smoothstep(0.,.25,d.y);
   vec3 cc=mix(vec3(1.,.93,.86),vec3(.72,.66,.66),fbm(uv*2.+3.))+vec3(1.,.7,.45)*pow(sd,4.)*.4;col=mix(col,cc,c*fade*.85);}
  if(d.y<0.)col=uH;gl_FragColor=vec4(col,1.);
  #include <tonemapping_fragment>
  #include <encodings_fragment>
 }`}));sky.renderOrder=-10;scene.add(sky);

// ---------- city layout ----------
const N=10,BL=44,RD=14,CELL=BL+RD,SIZE=N*CELL;const HALF=SIZE/2;
const solids=[];
const roadC=i=>-HALF+i*CELL-RD/2;
function hitSolid(x,z,r,y=0){for(const s of solids)if(y<s.h&&x+r>s.x0&&x-r<s.x1&&z+r>s.z0&&z-r<s.z1)return s;return null;}
const parks=new Set();for(let i=0;i<N;i++)for(let j=0;j<N;j++)if(Math.random()<.12)parks.add(i+','+j);
function blockOf(x,z){const i=Math.floor((x+HALF)/CELL),j=Math.floor((z+HALF)/CELL);if(i<0||j<0||i>=N||j>=N)return null;const lx=x+HALF-i*CELL,lz=z+HALF-j*CELL;if(lx>BL||lz>BL)return null;return{i,j,lx,lz,park:parks.has(i+','+j)};}

// ---------- ground: one smooth heightmap ----------
const GEXT=HALF+380,GC=8;// coarse grid cell size
const gN=Math.ceil(GEXT*2/GC)+1;const coarse=new Float32Array(gN*gN);
const vn=(x,y)=>K?K.noise3(x,y,.5):0;const fbm2=(x,y)=>{let s=0,a=1,n=0,f=1;for(let i=0;i<5;i++){s+=vn(x*f,y*f)*a;n+=a;a*=.5;f*=2;}return s/n;};
for(let j=0;j<gN;j++)for(let i=0;i<gN;i++){const x=-GEXT+i*GC,z=-GEXT+j*GC;let h=0;const out=Math.max(Math.abs(x),Math.abs(z))-(HALF+24);
 if(out>0)h=Math.min(1,out/120)*(fbm2(x/140,z/140)*55-8)+Math.min(1,out/40)*2;else{const b=blockOf(x,z);if(b&&b.park&&b.lx>6&&b.lx<BL-6&&b.lz>6&&b.lz<BL-6)h=.3+fbm2(x/18,z/18)*1.1;}
 coarse[j*gN+i]=h;}
const ss=t=>t*t*(3-2*t);
function groundH(x,z){const fx=(x+GEXT)/GC,fz=(z+GEXT)/GC;const i=Math.max(0,Math.min(gN-2,Math.floor(fx))),j=Math.max(0,Math.min(gN-2,Math.floor(fz)));const u=ss(Math.min(1,Math.max(0,fx-i))),v=ss(Math.min(1,Math.max(0,fz-j)));
 const a=coarse[j*gN+i],b=coarse[j*gN+i+1],c=coarse[(j+1)*gN+i],d=coarse[(j+1)*gN+i+1];return a+(b-a)*u+(c-a)*v+(a-b-c+d)*u*v;}
function surfH(x,z){const h=groundH(x,z);return h+(K?(vn(x*.9,z*.9)-.5)*(h>0.05?.12:.025):0);}
(function buildGround(){const seg=Math.round(GEXT*2/4);const geo=new THREE.PlaneGeometry(GEXT*2,GEXT*2,seg,seg);geo.rotateX(-Math.PI/2);
 const p=geo.attributes.position,col=new Float32Array(p.count*3);
 for(let i=0;i<p.count;i++){const x=p.getX(i),z=p.getZ(i);p.setY(i,surfH(x,z));}
 geo.computeVertexNormals();const nrm=geo.attributes.normal;
 for(let i=0;i<p.count;i++){const x=p.getX(i),z=p.getZ(i),y=p.getY(i);const b=blockOf(x,z);const out=Math.max(Math.abs(x),Math.abs(z))>HALF+20;let c;
  const m=vn(x*.05+9,z*.05),m2=vn(x*.3,z*.3);
  if(out||(b&&b.park)){const grass=[.27,.42,.17],dry=[.45,.46,.24],mud=[.33,.25,.17],dirt=[.42,.33,.23];c=grass.map((g,k)=>g+(dry[k]-g)*Math.max(0,m-.45)*1.6);
   if(m2>.66)c=c.map((g,k)=>g+(mud[k]-g)*Math.min(1,(m2-.66)*4));if(out&&Math.max(Math.abs(x),Math.abs(z))<HALF+40)c=c.map((g,k)=>g+(dirt[k]-g)*.6);}
  else{const a=.2+m2*.05;c=[a,a,a*1.04];}
  const slope=1-nrm.getY(i);const dk=1-Math.min(.55,slope*2.2);col.set([c[0]*dk,c[1]*dk,c[2]*dk],i*3);}
 geo.setAttribute('color',new THREE.BufferAttribute(col,3));
 let gm;if(K){const d=K.get('detail');const map=d.map.clone(),nm=d.normalMap.clone();map.repeat.set(GEXT*2/5,GEXT*2/5);nm.repeat.copy(map.repeat);map.needsUpdate=nm.needsUpdate=true;gm=new THREE.MeshStandardMaterial({map,normalMap:nm,normalScale:new THREE.Vector2(.45,.45),vertexColors:true,roughness:.95});}
 else gm=new THREE.MeshStandardMaterial({vertexColors:true,roughness:.95});
 const g=new THREE.Mesh(geo,gm);g.receiveShadow=true;scene.add(g);
 const far=new THREE.Mesh(new THREE.CircleGeometry(4000,48),new THREE.MeshStandardMaterial({color:0x6d7a52,roughness:1}));far.rotation.x=-Math.PI/2;far.position.y=-6;scene.add(far);})();
// road markings (instanced decals)
{const lineM=new THREE.MeshStandardMaterial({color:0xe8d27a,roughness:.7});const lg=new THREE.PlaneGeometry(.28,3,1,1);
 const lines=new THREE.InstancedMesh(lg,lineM,N*2*(N+1)*8);let li=0;const dm=new THREE.Object3D();
 for(let i=0;i<=N;i++){const c=-HALF+i*CELL-RD/2;for(let j=0;j<N;j++)for(let k=0;k<8;k++){const t=-HALF+j*CELL+4+k*6.5;
  dm.position.set(c,.035,t);dm.rotation.set(-Math.PI/2,0,0);dm.updateMatrix();lines.setMatrixAt(li++,dm.matrix);
  dm.position.set(t,.035,c);dm.rotation.set(-Math.PI/2,0,Math.PI/2);dm.updateMatrix();lines.setMatrixAt(li++,dm.matrix);}}lines.count=li;lines.receiveShadow=true;scene.add(lines);}

// ---------- blocks: sidewalks, buildings, trees, props ----------
const treeSpots=[],lightSpots=[],hydSpots=[],binSpots=[],benchSpots=[],chimneys=[];
for(let i=0;i<N;i++)for(let j=0;j<N;j++){const x0=-HALF+i*CELL,z0=-HALF+j*CELL,cx0=x0+BL/2,cz0=z0+BL/2;const park=parks.has(i+','+j);
 // street lights on the 4 corners, arm toward the road
 for(const[sx,sz]of[[-1,-1],[1,-1],[-1,1],[1,1]])lightSpots.push([cx0+sx*(BL/2-1.2),cz0+sz*(BL/2-1.2),Math.atan2(-sz,sx)+(Math.random()<.5?0:Math.PI/2)]);
 if(Math.random()<.5)hydSpots.push([cx0+rnd(-1,1)*(BL/2-1),cz0+(Math.random()<.5?-1:1)*(BL/2-.9)]);
 for(let k=0;k<2;k++)binSpots.push([cx0+(Math.random()<.5?-1:1)*(BL/2-1),cz0+rnd(-1,1)*(BL/2-4)]);
 if(park){for(let t=0;t<9;t++){const tx=x0+rnd(7,BL-7),tz=z0+rnd(7,BL-7);treeSpots.push([tx,tz,rnd(.8,1.25)]);solids.push({x0:tx-.4,x1:tx+.4,z0:tz-.4,z1:tz+.4,h:6});}
  for(let b=0;b<3;b++)benchSpots.push([x0+rnd(8,BL-8),z0+rnd(8,BL-8),Math.random()*7]);
  // park keeps a sidewalk ring only (no slab), flat edge
  continue;}
 const sw=use('sidewalk',(w,d)=>{const m=new THREE.Mesh(new THREE.BoxGeometry(w,.25,d),mat(0x8e8e8e));m.receiveShadow=true;m.position.y=.125;return m;},BL,BL);sw.position.x=cx0;sw.position.z=cz0;scene.add(sw);
 // street trees along the curb
 for(let t=0;t<3;t++){const e=Math.random()*4|0,u=rnd(-BL/2+5,BL/2-5);const tx=cx0+(e<2?u:(e==2?-1:1)*(BL/2-1.6)),tz=cz0+(e<2?(e==0?-1:1)*(BL/2-1.6):u);treeSpots.push([tx,tz,rnd(.55,.8),.25]);solids.push({x0:tx-.3,x1:tx+.3,z0:tz-.3,z1:tz+.3,h:5});}
 const sub=Math.random()<.5?2:1;const s=BL/sub;
 for(let a=0;a<sub;a++)for(let b=0;b<sub;b++){const dist=Math.hypot(cx0,cz0)/HALF;const h=rnd(8,18)+(1-dist)*rnd(10,70)*(Math.random()<.5?1:.3);
  const w=s-rnd(4,7),d=s-rnd(4,7),cx=x0+a*s+s/2,cz=z0+b*s+s/2;const style=Math.random()*7|0,seed=(i*97+j*31+a*7+b)|0;
  const bm=use('building',(w,d,h)=>{const m=new THREE.Mesh(new THREE.BoxGeometry(w,h,d),mat(0x9a8f80));m.position.y=h/2;return m;},w,d,h,style,seed);
  bm.position.x=cx;bm.position.z=cz;bm.position.y+=.25;bm.traverse(o=>{if(o.isMesh){o.castShadow=o.receiveShadow=true;}});scene.add(bm);
  solids.push({x0:cx-w/2,x1:cx+w/2,z0:cz-d/2,z1:cz+d/2,h:h+.25});if(h>30&&Math.random()<.18)chimneys.push([cx+rnd(-w/4,w/4),h+1,cz+rnd(-d/4,d/4)]);}}
solids.push({x0:-HALF-60,x1:-HALF-20,z0:-HALF-60,z1:HALF+60,h:9},{x0:HALF+20,x1:HALF+60,z0:-HALF-60,z1:HALF+60,h:9},{x0:-HALF-60,x1:HALF+60,z0:-HALF-60,z1:-HALF-20,h:9},{x0:-HALF-60,x1:HALF+60,z0:HALF+20,z1:HALF+60,h:9});
const dm0=new THREE.Object3D();
function instance(geo,m,spots,place){const im=new THREE.InstancedMesh(geo,m,spots.length);spots.forEach((s,k)=>{place(dm0,s);dm0.updateMatrix();im.setMatrixAt(k,dm0.matrix);});im.castShadow=im.receiveShadow=true;scene.add(im);return im;}
{const tr=use('tree',()=>({trunk:new THREE.CylinderGeometry(.3,.4,3).translate(0,1.5,0),leaves:new THREE.SphereGeometry(2.2,12,10).translate(0,4.2,0),trunkMat:mat(0x6b4a2b),leafMat:mat(0x3f7a2f)}));
 const place=(o,s)=>{o.position.set(s[0],groundH(s[0],s[1])+(s[3]||0),s[1]);o.rotation.set(0,s[0]*13.7%6.28,0);o.scale.setScalar(s[2]);};
 instance(tr.trunk,tr.trunkMat,treeSpots,place);instance(tr.leaves,tr.leafMat,treeSpots,place);
 const P=use('props',()=>null);
 if(P){const lp=(o,s)=>{o.position.set(s[0],.25,s[1]);o.rotation.set(0,s[2],0);o.scale.setScalar(1);};instance(P.light.geo,P.light.mat,lightSpots,lp);instance(P.lens.geo,P.lens.mat,lightSpots,lp).castShadow=false;
  instance(P.hydrant.geo,P.hydrant.mat,hydSpots,(o,s)=>{o.position.set(s[0],.25,s[1]);o.rotation.set(0,s[0],0);});
  instance(P.bin.geo,P.bin.mat,binSpots,(o,s)=>{o.position.set(s[0],.25,s[1]);o.rotation.set(0,0,0);});
  instance(P.bench.geo,P.bench.mat,benchSpots,(o,s)=>{o.position.set(s[0],groundH(s[0],s[1]),s[1]);o.rotation.set(0,s[2],0);});
  lightSpots.forEach(s=>solids.push({x0:s[0]-.2,x1:s[0]+.2,z0:s[1]-.2,z1:s[1]+.2,h:7}));}
 // grass tufts: parks + fields outside the city
