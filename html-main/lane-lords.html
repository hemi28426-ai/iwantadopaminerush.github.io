<!doctype html>
<html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Lane Lords</title>
<script src="../site-status.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&family=Oswald:wght@500;700&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>

<style>
:root{--acc:#ffb52a;--panel:rgba(16,20,32,.42);--line:rgba(255,255,255,.16)}
html,body{margin:0;height:100%;background:#101420;color:#fff;font-family:Inter,system-ui,sans-serif;overflow:hidden;user-select:none}
h1,h2,#play,button,#timer,.card small,#name,.arena h2,#res h1{font-family:Oswald,Impact,sans-serif!important;letter-spacing:.04em}
.pill,.chest,.vs .p,#nav,.arena,#mana{background:var(--panel)!important;backdrop-filter:blur(10px) saturate(1.3);-webkit-backdrop-filter:blur(10px) saturate(1.3);border:1px solid var(--line)!important}
#manaF{background:linear-gradient(90deg,#d98a1a,var(--acc))!important}
#mana{display:flex;align-items:center}#manaIc{position:absolute;left:-28px;top:-3px;width:24px;height:24px}
#nav div.on{box-shadow:inset 0 3px 0 var(--acc)!important}
.cr{background:var(--panel)!important;backdrop-filter:blur(8px);border:1px solid var(--line)}
button{background:var(--acc)!important;color:#241500!important}
#play{background:linear-gradient(#ffcd5a,#f29a1a)!important}
#wrap{display:flex;flex-direction:column;align-items:center;height:100%}
canvas{border-radius:10px;touch-action:none;display:block}
.cr{position:absolute;left:8px;font:800 20px system-ui;background:#000a;padding:4px 10px;border-radius:8px}
#ui{display:flex;align-items:center;gap:10px;padding:8px}
.card{width:78px;height:100px;border-radius:10px;background:linear-gradient(#3a4466,#232842);border:2px solid #556;position:relative;cursor:pointer;display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:34px;transition:transform .1s}
.card small{font-size:11px;margin-top:2px}
.card .c{position:absolute;top:-8px;left:-8px;width:24px;height:24px;border-radius:50%;background:#b04ad6;font-size:14px;font-weight:700;display:flex;align-items:center;justify-content:center;border:2px solid #fff}
.card.sel{transform:translateY(-10px);border-color:#ffd54a;box-shadow:0 0 12px #ffd54a}
.card.poor{filter:grayscale(.8) brightness(.6)}
#mana{width:260px;height:22px;background:#222;border-radius:11px;overflow:hidden;position:relative;border:2px solid #555}
#manaF{height:100%;background:linear-gradient(90deg,#9b3fd0,#e46cf5);width:0}
#manaT{position:absolute;inset:0;text-align:center;font-weight:700;line-height:22px}
#next{font-size:12px;opacity:.7;text-align:center}
#ov{position:fixed;inset:0;background:radial-gradient(ellipse at 50% 20%,#3a5fb0,#1a2350 60%,#0d1230);display:flex;flex-direction:column;align-items:center;text-align:center;overflow:hidden}
#top{width:100%;max-width:560px;display:flex;justify-content:space-between;align-items:center;padding:10px 14px;box-sizing:border-box;font-weight:800}
.pill{background:#0008;border-radius:20px;padding:6px 14px;font-size:17px;border:2px solid #fff2}
#name{font-size:17px;text-align:left}#name small{display:block;font-size:12px;opacity:.7;font-weight:600}
.scr{flex:1;width:100%;max-width:560px;display:flex;flex-direction:column;align-items:center;overflow:auto;padding:0 12px 10px;box-sizing:border-box}
#nav{display:flex;width:100%;max-width:560px;background:#0009;border-top:2px solid #fff2}
#nav div{flex:1;padding:12px;font-weight:800;cursor:pointer;opacity:.6}#nav div.on{opacity:1;background:#fff1;box-shadow:inset 0 3px 0 #ffcf3a}
.arena{margin-top:8px;width:100%;border-radius:16px;padding:16px;box-sizing:border-box;background:linear-gradient(#ffffff18,#0003);border:2px solid #fff2}
.arena h2{margin:0;font-size:28px;text-shadow:0 3px 0 #0006}.arena .ic{display:flex;justify-content:center;filter:drop-shadow(0 6px 8px #0008);margin:4px}
.road{height:14px;background:#0007;border-radius:7px;overflow:hidden;margin:8px 0 2px}.road i{display:block;height:100%;background:linear-gradient(90deg,#ffcf3a,#ff8a2a)}
#play{font:900 34px system-ui;padding:16px 70px;border-radius:16px;background:linear-gradient(#ffd34a,#f29a1a);color:#3a2000;box-shadow:0 6px 0 #a35a00,0 10px 20px #0008;margin:16px;letter-spacing:2px;text-shadow:0 2px 0 #fff6}
#play:active{transform:translateY(4px);box-shadow:0 2px 0 #a35a00}
.chests{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;width:100%}
.chest{background:#0006;border:2px solid #fff2;border-radius:12px;height:96px;display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:12px;font-weight:700;cursor:pointer}
.chest b{font-size:38px;line-height:1.1}.chest.ready{border-color:#7dff8a;box-shadow:0 0 12px #7dff8a;animation:bob 1s infinite alternate}
@keyframes bob{to{transform:translateY(-4px)}}
.deck{display:grid;grid-template-columns:repeat(4,78px);gap:12px 10px;margin:10px}
.deck .card.in{border-color:#4caf50;box-shadow:0 0 10px #4caf50}
.lv{position:absolute;bottom:-9px;left:50%;transform:translateX(-50%);background:#222;border:1px solid #888;border-radius:6px;font-size:10px;padding:0 5px;white-space:nowrap}
.up{position:absolute;top:-8px;right:-8px;background:#3ad16a;border-radius:50%;width:20px;height:20px;font-size:13px;display:flex;align-items:center;justify-content:center;border:2px solid #fff}
#mm,#res,#chestO{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;background:radial-gradient(#1f2a5a,#070a1a)}
.vs{display:flex;align-items:center;gap:20px;margin:20px}.vs .p{background:#0007;border-radius:14px;padding:16px 22px;min-width:150px;border:2px solid}
.vs .p b{display:block;font-size:22px}.spin{width:60px;height:60px;border:6px solid #fff3;border-top-color:#ffcf3a;border-radius:50%;animation:sp 1s linear infinite}@keyframes sp{to{transform:rotate(360deg)}}
#res h1{font:900 64px system-ui;margin:0}
.diff{display:inline-block;padding:2px 10px;border-radius:8px;font-size:13px;margin-top:6px}
button{font:700 18px system-ui;padding:12px 26px;border:0;border-radius:9px;background:#e0a42b;color:#222;cursor:pointer;margin:6px}
.deck{display:grid;grid-template-columns:repeat(6,78px);gap:10px;margin:14px}
.deck .card.in{border-color:#4caf50;box-shadow:0 0 10px #4caf50}
#info{max-width:520px;opacity:.85;font-size:13px;min-height:36px}
.hid{display:none!important}
#nxt .art{width:38px;height:44px}
.art.big{width:150px;height:150px}.art.chest{width:64px;height:56px}.art.huge{width:200px;height:170px}
.art{width:62px;height:66px;background-size:contain;background-position:center;background-repeat:no-repeat}
.ico-coin{display:inline-block;width:.95em;height:.95em;border-radius:50%;background:radial-gradient(circle at 35% 30%,#fff3a0,#f2b52a 55%,#b9780e);box-shadow:inset 0 0 0 2px #a8700a;vertical-align:-.15em}
.ico-tro{display:inline-block;width:.8em;height:.95em;vertical-align:-.15em;background:linear-gradient(#ffe27a,#d99a12);clip-path:polygon(0 0,100% 0,100% 30%,78% 55%,58% 62%,58% 80%,80% 82%,80% 100%,20% 100%,20% 82%,42% 80%,42% 62%,22% 55%,0 30%)}
.ico-crown{display:inline-block;width:1.1em;height:.85em;vertical-align:-.1em;background:linear-gradient(#ffe27a,#d99a12);clip-path:polygon(0 25%,25% 60%,50% 0,75% 60%,100% 25%,92% 100%,8% 100%)}
.ico-crown.off{background:#fff3}
</style></head><body>
<div id="wrap"><div style="position:relative"><canvas id="cv"></canvas><div id="crR" class="cr" style="top:38%;color:#ff8a7a"></div><div id="crB" class="cr" style="top:56%;color:#8ac4ff"></div></div>
<div id="ui"><div><div id="next">Next</div><div class="card" id="nxt" style="width:46px;height:60px;font-size:22px"></div></div><div id="hand" style="display:flex;gap:8px"></div><div><div id="mana" style="position:relative;overflow:visible"><svg id="manaIc" viewBox="0 0 24 24"><path d="M12 2c3 4.5 7 8.6 7 12.6A7 7 0 0 1 5 14.6C5 10.6 9 6.5 12 2z" fill="#ffb52a" stroke="rgba(0,0,0,.4)"/><path d="M9 14a3 3 0 0 0 3 3" stroke="#fff8" stroke-width="1.6" fill="none" stroke-linecap="round"/></svg><div style="position:relative;flex:1;height:100%;border-radius:11px;overflow:hidden"><div id="manaF"></div><div id="manaT">0</div></div></div><div id="timer" style="text-align:center;margin-top:6px;font-weight:700"></div></div></div></div>
<div id="ov"><div id="top"><div id="name"></div><div style="display:flex;gap:8px"><span class="pill" id="tro"></span><span class="pill" id="gld"></span></div></div>
<div class="scr" id="sHome"><div class="arena" id="arena"></div><button id="play">BATTLE</button><div style="align-self:flex-start;font-weight:800;margin:4px 0 6px">Chests</div><div class="chests" id="chests"></div><div id="rec" style="opacity:.6;margin-top:10px;font-size:13px"></div></div>
<div class="scr hid" id="sDeck"><div style="font-weight:800;margin-top:6px">Battle Deck <span id="dcount"></span></div><div class="deck" id="deck"></div><div id="info">Tap a card to add/remove it. Tap the green + to upgrade.</div></div>
<div id="nav"><div data-s="sHome" class="on">Battle</div><div data-s="sDeck">Deck</div></div></div>
<div id="mm" class="hid"></div><div id="res" class="hid"></div><div id="chestO" class="hid"></div>
<script>
(()=>{
const IC={coin:'<i class="ico-coin"></i>',tro:'<i class="ico-tro"></i>',crown:'<i class="ico-crown"></i>',crownOff:'<i class="ico-crown off"></i>'};
const ART={};const art=(k,cls)=>'<div class="art '+(cls||'')+'" style="background-image:url('+(ART[k]||'')+')"></div>';
const cv=document.getElementById('cv');const W=540,H=760,RIVER=H/2,TILE=30;
// ---- cards ----
const C={
 knight:{e:'🗡️',n:'Knight',c:3,hp:700,dmg:80,rate:1.1,rng:22,spd:45,r:13,col:'#c9c9d6',d:'Tough melee fighter.'},
 archers:{e:'🏹',n:'Archers',c:3,hp:200,dmg:45,rate:1,rng:150,spd:50,r:10,count:2,air:1,col:'#d65fa0',d:'Two ranged shooters. Hit air.'},
 giant:{e:'🗿',n:'Brute',c:5,hp:2200,dmg:130,rate:1.5,rng:22,spd:30,r:19,bld:1,col:'#c08a4a',d:'Huge HP. Only attacks towers.'},
 goblins:{e:'👺',n:'Goblins',c:2,hp:150,dmg:60,rate:.9,rng:18,spd:80,r:9,count:3,col:'#5fb24a',d:'Three fast stabbers.'},
 wizard:{e:'🧙',n:'Pyromancer',c:5,hp:420,dmg:140,rate:1.4,rng:140,spd:45,r:12,splash:45,air:1,col:'#e06a2b',d:'Splash fireballs. Hits air.'},
 drake:{e:'🐉',n:'Drake',c:4,hp:700,dmg:90,rate:1.5,rng:40,spd:55,r:15,fly:1,air:1,splash:30,col:'#7a4ad6',d:'Flying splash. Only ranged/air can hit it.'},
 skel:{e:'💀',n:'Bone Horde',c:3,hp:60,dmg:50,rate:1,rng:16,spd:70,r:7,count:8,col:'#eee',d:'Eight fragile skeletons.'},
 ram:{e:'🐏',n:'Ram Rider',c:4,hp:1100,dmg:200,rate:1.6,rng:22,spd:85,r:15,bld:1,col:'#9c6a3a',d:'Fast. Rams towers.'},
 golem:{e:'🪨',n:'Stone Golem',c:8,hp:4200,dmg:250,rate:2.5,rng:24,spd:22,r:24,bld:1,col:'#7d8590',d:'Massive tank. Splits on death.',death:'mini'},
 mini:{e:'🪨',n:'Golemite',c:0,hp:700,dmg:60,rate:2,rng:20,spd:30,r:13,bld:1,col:'#99a1ab',count:2},
 musk:{e:'🔫',n:'Gunner',c:4,hp:520,dmg:110,rate:1.1,rng:170,spd:45,r:12,air:1,col:'#3a7ad6',d:'Long-range single target.'},
 fireball:{e:'🔥',n:'Fireball',c:4,spell:1,dmg:450,rad:60,d:'Blast an area. 450 dmg.'},
 zap:{e:'⚡',n:'Zap',c:2,spell:1,dmg:160,rad:50,stun:.6,d:'Quick zap, stuns.'},
 tower:{e:'🏯',n:'Cannon',c:3,hp:900,dmg:90,rate:.9,rng:150,spd:0,r:18,build:1,life:30,col:'#666',d:'Defensive building (30s).'},
 heal:{e:'💚',n:'Heal',c:3,spell:1,heal:400,rad:80,d:'Heals your troops in an area.'},
};
const ALL=['knight','archers','giant','goblins','wizard','drake','skel','ram','golem','musk','fireball','zap','tower','heal'];
let deck=JSON.parse(localStorage.getItem('ll_deck')||'null')||['knight','archers','giant','goblins','wizard','skel','fireball','zap'];

const ARENAS=[[0,'Goblin Grounds','goblins','#4a8a3a'],[300,'Bone Pit','skel','#6a6a7a'],[650,'Drake Peaks','drake','#7a4ad6'],[1100,'Golem Quarry','golem','#8a6a42'],[1600,'Fire Keep','wizard','#c0452b'],[2300,"Lords' Throne",'knight','#d6a52b']];
const NAMES=['xXSlayerXx','GoblinKing','TowerTaker','Mr. Elixir','LaneMain','NoobMaster','DrakeRider','BoneLord','Crown Thief','KingSmasher','sweatyhands','PyroPete','RamJam','GolemGuy','ZapZap','Sir Knightly','ArcherAce','LuckyLoot'];
const CARDS=ALL;
let prof=JSON.parse(localStorage.getItem('ll_prof')||'null')||{tr:0,gold:200,lvl:{},cp:{},chests:[null,null,null,null],w:0,l:0,cr:0,name:'Player'+(1000+Math.random()*9000|0)};
CARDS.forEach(k=>{prof.lvl[k]=prof.lvl[k]||1;prof.cp[k]=prof.cp[k]||0;});
const saveP=()=>localStorage.setItem('ll_prof',JSON.stringify(prof));saveP();
const upCost=l=>({cp:[2,4,10,20,50,100,200][l-1]||9999,g:[20,50,150,400,1000,2000,5000][l-1]||1e9});
const arenaOf=t=>{let a=ARENAS[0],i=0;ARENAS.forEach((x,j)=>{if(t>=x[0]){a=x;i=j;}});return[a,i];};
function drawTop(){document.getElementById('name').innerHTML=prof.name+'<small>'+arenaOf(prof.tr)[0][1]+'</small>';document.getElementById('tro').innerHTML=IC.tro+' '+prof.tr;document.getElementById('gld').innerHTML=IC.coin+' '+prof.gold;}
function drawHome(){drawTop();const[a,i]=arenaOf(prof.tr),nx=ARENAS[i+1];
 document.getElementById('arena').style.background='linear-gradient('+a[3]+'cc,#0005)';
 document.getElementById('arena').innerHTML='<div style="opacity:.8;font-size:13px;font-weight:700">ARENA '+(i+1)+'</div><h2>'+a[1]+'</h2><div class="ic">'+art(a[2],'big')+'</div>'+(nx?'<div class="road"><i style="width:'+Math.min(100,(prof.tr-a[0])/(nx[0]-a[0])*100)+'%"></i></div><div style="font-size:12px;opacity:.8">'+prof.tr+' / '+nx[0]+' '+IC.tro+' to '+nx[1]+'</div>':'<div style="font-size:13px">Top arena!</div>');
 const ch=document.getElementById('chests');ch.innerHTML='';const now=Date.now();const unlocking=prof.chests.some(c=>c&&c.end&&c.end>now);
 prof.chests.forEach((c,i)=>{const d=document.createElement('div');d.className='chest';
  if(!c){d.innerHTML='<span style="opacity:.4">Empty slot</span>';}
  else{const ready=c.end&&c.end<=now;d.classList.toggle('ready',ready);const t=c.end?Math.max(0,Math.ceil((c.end-now)/1000)):c.secs;
   d.innerHTML=art('chest_'+c.t,'chest')+CHEST[c.t].n+'<span style="opacity:.8;font-weight:600">'+(ready?'OPEN!':c.end?fmt(t):(unlocking?fmt(c.secs):'Tap to unlock'))+'</span>';
   d.onclick=()=>{if(ready)openChest(i);else if(!c.end&&!unlocking){c.end=Date.now()+c.secs*1000;saveP();drawHome();}};}
  ch.appendChild(d);});
 document.getElementById('rec').textContent='Wins '+prof.w+' · Losses '+prof.l+' · Crowns '+prof.cr;}
const fmt=t=>t>=60?Math.floor(t/60)+'m '+(t%60)+'s':t+'s';
const CHEST={wood:{n:'Wooden',e:'📦',secs:15,g:[20,40],c:6},silver:{n:'Silver',e:'🧰',secs:60,g:[50,90],c:14},gold:{n:'Golden',e:'💰',secs:180,g:[150,260],c:35},magic:{n:'Magic',e:'🔮',secs:480,g:[400,700],c:90}};
setInterval(()=>{if(!document.getElementById('sHome').classList.contains('hid')&&!document.getElementById('ov').classList.contains('hid'))drawHome();},1000);
function openChest(i){const c=prof.chests[i],d=CHEST[c.t];prof.chests[i]=null;const g=d.g[0]+Math.random()*(d.g[1]-d.g[0])|0;prof.gold+=g;
 const got={};let n=d.c;while(n>0){const k=CARDS[Math.random()*CARDS.length|0];const a=Math.min(n,1+Math.random()*Math.ceil(d.c/3)|0);got[k]=(got[k]||0)+a;n-=a;}
 for(const k in got)prof.cp[k]+=got[k];saveP();const o=document.getElementById('chestO');o.classList.remove('hid');
 o.innerHTML=art('chest_'+c.t,'huge')+'<h2>'+d.n+' Chest</h2><div style="font-size:22px;font-weight:800">+'+g+' '+IC.coin+'</div><div class="deck" style="grid-template-columns:repeat(4,78px)">'+Object.keys(got).map(k=>'<div class="card"><div class="c">'+C[k].c+'</div>'+art(k)+'<small>'+C[k].n+'</small><span class="lv">x'+got[k]+'</span></div>').join('')+'</div><button id="chOk">Collect</button>';
 document.getElementById('chOk').onclick=()=>{o.classList.add('hid');drawHome();drawDeck();};}
function drawDeck(){drawTop();const d=document.getElementById('deck');d.innerHTML='';CARDS.forEach(k=>{const c=C[k];const el=document.createElement('div');el.className='card'+(deck.includes(k)?' in':'');
 const L=prof.lvl[k],u=upCost(L),can=prof.cp[k]>=u.cp&&prof.gold>=u.g&&L<8;
 el.innerHTML='<div class="c">'+c.c+'</div>'+art(k)+'<small>'+c.n+'</small><span class="lv">Lv'+L+' · '+prof.cp[k]+'/'+u.cp+'</span>'+(can?'<div class="up">+</div>':'');
 el.onmouseenter=()=>document.getElementById('info').textContent=c.n+' (Lv'+L+') — '+c.d+(L<8?' · Upgrade: '+u.cp+' copies + '+u.g+' gold':'');
 el.onclick=ev=>{if(ev.target.classList.contains('up')){prof.cp[k]-=u.cp;prof.gold-=u.g;prof.lvl[k]++;saveP();drawDeck();return;}
  if(deck.includes(k)){if(deck.length>1)deck=deck.filter(x=>x!==k);}else if(deck.length<8)deck.push(k);else{deck.shift();deck.push(k);}localStorage.setItem('ll_deck',JSON.stringify(deck));drawDeck();};d.appendChild(el);});
 document.getElementById('dcount').textContent='('+deck.length+'/8)';}
document.querySelectorAll('#nav div').forEach(n=>n.onclick=()=>{document.querySelectorAll('#nav div').forEach(x=>x.classList.toggle('on',x===n));['sHome','sDeck'].forEach(id=>document.getElementById(id).classList.toggle('hid',id!==n.dataset.s));drawHome();drawDeck();});
drawHome();drawDeck();
// ---- matchmaking ----
let opp=null,myLv=1,oppLv=1;
const DIFF=d=>d<.3?['Chill','#3ad16a']:d<.55?['Decent','#e0c02b']:d<.8?['Sweaty','#f0802a']:['Tryhard','#e03a3a'];
function findMatch(){if(deck.length<8){document.querySelector('#nav div[data-s=sDeck]').click();document.getElementById('info').textContent='Pick 8 cards first!';return;}
 const mm=document.getElementById('mm');mm.classList.remove('hid');mm.innerHTML='<div class="spin"></div><h2>Finding opponent…</h2><div style="opacity:.7">'+arenaOf(prof.tr)[0][1]+'</div><button id="mmX" style="background:#555;color:#fff">Cancel</button>';
 let cancel=false;document.getElementById('mmX').onclick=()=>{cancel=true;mm.classList.add('hid');};
 setTimeout(()=>{if(cancel)return;
  const d=Math.max(.02,Math.min(.45,.03+prof.tr/8000+Math.random()*.15));
  myLv=deck.reduce((a,k)=>a+prof.lvl[k],0)/deck.length;oppLv=Math.max(1,Math.min(Math.floor(myLv),Math.round(myLv-.5+(Math.random()-.5)*.8)));
  const otr=Math.max(0,prof.tr+((Math.random()-.5)*120|0));
  const pool=CARDS.filter(k=>k!=='heal'||Math.random()<.5);opp={name:NAMES[Math.random()*NAMES.length|0]+(Math.random()<.4?(Math.random()*99|0):''),d,tr:otr,deck:shuf([...pool]).slice(0,8)};
  if(!opp.deck.some(k=>!C[k].spell&&!C[k].build))opp.deck[0]='knight';
  const[dn,dc]=DIFF(d);
  mm.innerHTML='<div class="vs"><div class="p" style="border-color:#3a7ad6"><b>'+prof.name+'</b>'+IC.tro+' '+prof.tr+'<br>Lv '+myLv.toFixed(1)+'</div><div style="font:900 40px system-ui;color:#ffcf3a">VS</div><div class="p" style="border-color:#d33a3a"><b>'+opp.name+'</b>'+IC.tro+' '+otr+'<br>Lv '+oppLv+'<br><span class="diff" style="background:'+dc+'">'+dn+'</span></div></div><div style="opacity:.7">Get ready…</div>';
  setTimeout(()=>{mm.classList.add('hid');reset(d);},2200);},1200+Math.random()*1800);}
document.getElementById('play').onclick=findMatch;

// ---- state ----
let ents,parts,mana,eMana,hand,queue,eHand,eQueue,selI,T,over,hard,crowns,ecrowns,last;
const LX=[135,405];
